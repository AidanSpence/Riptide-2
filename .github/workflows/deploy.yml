name: Validate and deploy Riptide

on:
  push:
    branches: [Deployment]
  pull_request:
    branches: [Deployment]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the backend after checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: riptide-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  APPLICATION_NAME: Riptide
  ENVIRONMENT_NAME: Riptide2-env

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: riptide
          POSTGRES_USER: riptide
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U riptide -d riptide"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_DEBUG: '1'
      DB_NAME: riptide
      DB_USER: riptide
      DB_PASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_SSLMODE: disable
      SPOTIFY_CLIENT_ID: ci-placeholder
      SPOTIFY_CLIENT_SECRET: ci-placeholder
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Django/requirements.txt
      - run: pip install -r Django/requirements.txt
      - name: Check fresh database setup and migrations
        working-directory: Django
        run: |
          python manage.py prepare_deployment
          python manage.py makemigrations --check --dry-run
          python manage.py test --settings=config.test_settings
      - name: Check production settings
        working-directory: Django
        env:
          DJANGO_DEBUG: '0'
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: localhost
          FRONTEND_URL: https://d1caj2u4jm9c3j.cloudfront.net
          SPOTIFY_REDIRECT_URI: https://d1caj2u4jm9c3j.cloudfront.net/spotify/callback/
          CLOUDFRONT_ORIGIN_SECRET: ci-only-origin-placeholder
        run: python manage.py check --deploy --fail-level ERROR
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: HTML/riptide-web/package-lock.json
      # - name: Build static frontend
      #   working-directory: HTML/riptide-web
      #   env:
      #     NEXT_PUBLIC_API_URL: ''
      #   run: |
      #     # npm ci
      #     # npm run lint
      #     # npm run build
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: riptide-frontend
      #     path: HTML/riptide-web/out/
      #     if-no-files-found: error
      - name: Build backend image
        run: docker build -t riptide-check Django
      - run: python scripts/package_backend.py riptide-backend.zip
      - uses: actions/upload-artifact@v4
        with:
          name: riptide-backend
          path: riptide-backend.zip

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/Deployment' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: riptide-backend
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish application version and deploy
        shell: bash
        run: |
          set -euo pipefail
          actual_app=$(aws elasticbeanstalk describe-environments --environment-names "$ENVIRONMENT_NAME" --query 'Environments[0].ApplicationName' --output text)
          test "$actual_app" = "$APPLICATION_NAME"
          bucket=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          version="riptide-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          object_key="riptide/${version}.zip"
          aws s3 cp riptide-backend.zip "s3://${bucket}/${object_key}"
          aws elasticbeanstalk create-application-version \
            --application-name "$APPLICATION_NAME" \
            --version-label "$version" \
            --source-bundle "S3Bucket=${bucket},S3Key=${object_key}" \
            --process

          # --process is asynchronous. Do not point the environment at the
          # version until Elastic Beanstalk has finished validating the bundle.
          version_status=""
          for attempt in {1..36}; do
            version_status=$(aws elasticbeanstalk describe-application-versions \
              --application-name "$APPLICATION_NAME" \
              --version-labels "$version" \
              --query 'ApplicationVersions[0].Status' \
              --output text)
            case "${version_status,,}" in
              processed) break ;;
              failed)
                echo "Elastic Beanstalk failed to process application version $version" >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "${version_status,,}" != "processed" ]; then
            echo "Timed out waiting for Elastic Beanstalk to process application version $version (last status: $version_status)" >&2
            exit 1
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "$ENVIRONMENT_NAME" \
            --version-label "$version"
          aws elasticbeanstalk wait environment-updated --environment-names "$ENVIRONMENT_NAME"
          deployed=$(aws elasticbeanstalk describe-environments --environment-names "$ENVIRONMENT_NAME" --query 'Environments[0].VersionLabel' --output text)
          test "$deployed" = "$version"
          hostname=$(aws elasticbeanstalk describe-environments --environment-names "$ENVIRONMENT_NAME" --query 'Environments[0].CNAME' --output text)
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 --max-time 15 "http://${hostname}/health/"
