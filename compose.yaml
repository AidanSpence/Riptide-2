services:
  web:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-local-container-key-change-me}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - riptide_data:/data

volumes:
  riptide_data: